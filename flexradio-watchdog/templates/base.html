<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FlexRadio Watchdog{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; color: #e0e0e0; }
    .navbar { background: #16213e !important; }
    .card { background: #16213e; border: 1px solid #0f3460; }
    .card-header { background: #0f3460; border-bottom: 1px solid #0f3460; }
    .table { color: #e0e0e0; }
    .status-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
    .status-dot.alive { background: #28a745; box-shadow: 0 0 8px #28a745; }
    .status-dot.dead { background: #dc3545; box-shadow: 0 0 8px #dc3545; animation: pulse 1.2s infinite; }
    .status-dot.unknown { background: #6c757d; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .log-table { font-size: 0.85rem; }
    .log-table td { padding: 0.25rem 0.5rem; }
    .btn-outline-danger { border-color: #dc3545; color: #dc3545; }
    .wizard-step { display: none; }
    .wizard-step.active { display: block; }
    .form-control, .form-select { background: #0f3460; border-color: #1a1a5e; color: #e0e0e0; }
    .form-control:focus, .form-select:focus { background: #0f3460; color: #e0e0e0; border-color: #4a90d9; box-shadow: 0 0 0 0.2rem rgba(74,144,217,0.25); }
    .form-control::placeholder { color: #8899aa; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">FlexRadio Watchdog</a>
      <div>
        <a href="/dashboard" class="btn btn-sm btn-outline-light me-2">Dashboard</a>
        <a href="/wizard" class="btn btn-sm btn-outline-light">Setup</a>
      </div>
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
